<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aleksandrovi Recepti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-head">
  <div class="site-head__inner">
    <h1 class="site-title">Aleksandrovi Recepti</h1>
    <p class="site-sub">lična zbirka recepata koje volim</p>
  </div>
</header>

<main class="wrap">

  <!-- ============ PREGLED RECEPATA ============ -->
  <section id="browse-view">
    <nav class="filter-bar" id="filter-bar" aria-label="Filtriraj recepte po tagu">
      <!-- tagovi ubacuje app.js -->
    </nav>

    <p class="empty-msg" id="empty-msg" hidden>Nema recepata sa ovim tagom.</p>

    <div class="grid" id="recipe-grid">
      <!-- kartice recepata ubacuje app.js -->
    </div>
  </section>

  <!-- ============ PRIKAZ RECEPTA ============ -->
  <section id="detail-view" hidden>
    <div class="detail-topbar">
      <button class="back-btn" id="back-btn" type="button">&larr; nazad na pregled</button>
      <div class="topbar-right">
        <span class="wakelock-status" id="wakelock-status" hidden>🔒 ekran ostaje uključen</span>
        <div class="alarm-widget" id="alarm-widget">
          <svg class="alarm-clock" viewBox="0 0 100 100" aria-hidden="true">
            <path class="alarm-leg" d="M27 26 L38 34" />
            <path class="alarm-leg" d="M73 26 L62 34" />
            <circle class="alarm-bell" cx="21" cy="18" r="12" />
            <circle class="alarm-bell" cx="79" cy="18" r="12" />
            <line class="alarm-strike" x1="50" y1="9" x2="50" y2="17" />
            <circle class="alarm-knob" cx="50" cy="7" r="3.5" />
            <circle class="alarm-foot" cx="33" cy="87" r="4" />
            <circle class="alarm-foot" cx="67" cy="87" r="4" />
            <circle class="alarm-body" cx="50" cy="57" r="31" />
            <circle class="alarm-face" cx="50" cy="57" r="25.5" />
            <g class="alarm-ticks">
              <line x1="50" y1="34" x2="50" y2="38" />
              <line x1="50" y1="76" x2="50" y2="80" />
              <line x1="27" y1="57" x2="31" y2="57" />
              <line x1="69" y1="57" x2="73" y2="57" />
            </g>
          </svg>
          <div class="alarm-time" id="timer-display">--:--</div>
          <div class="alarm-controls">
            <input class="alarm-input" type="number" id="timer-minutes" min="0" step="0.1" placeholder="min" inputmode="decimal" aria-label="Minuti za tajmer">
            <button class="alarm-toggle" id="timer-toggle" type="button" aria-label="Pokreni tajmer">▶</button>
          </div>
        </div>
      </div>
    </div>

    <article class="detail-card">
      <div class="detail-hero" id="detail-hero"></div>

      <div class="detail-body">
        <div class="detail-tags" id="detail-tags"></div>
        <h2 class="detail-title" id="detail-title"></h2>
        <p class="detail-desc" id="detail-desc"></p>

        <h3 class="ingredients-heading" id="ingredients-heading">Sastojci</h3>
        <ul class="ingredients" id="detail-ingredients"></ul>

        <h3 class="steps-heading">Koraci</h3>
        <ol class="steps" id="detail-steps"></ol>
      </div>
    </article>
  </section>

</main>

<footer class="site-foot">
  <p>Bez reklama,samo recepti</p>
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
